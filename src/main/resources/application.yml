server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/Spharos8th-Nirvana/nirvana-config-repo}
          # 개발 단계에서는 develop에 병합된 설정을 바로 반영한다.
          default-label: ${CONFIG_REPO_LABEL:develop}
          username: ${CONFIG_REPO_USERNAME:}
          password: ${CONFIG_REPO_TOKEN:}
          # 시작 시 저장소에 접근해 인증 오류를 첫 요청이 아닌 기동 시점에 드러낸다.
          clone-on-start: ${CONFIG_REPO_CLONE_ON_START:true}
          timeout: 10

management:
  endpoints:
    web:
      exposure:
        include: health
